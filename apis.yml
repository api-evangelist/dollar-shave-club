name: Dollar Shave Club
description: >-
  Dollar Shave Club is a direct-to-consumer men's grooming brand founded in 2011 and best
  known for its subscription razor and blade service that ships razors, blades, shave butter,
  and personal-care products to members on a recurring schedule. Acquired by Unilever in 2016
  and later sold to Nexus Capital Management in 2023, the company sells online through its
  storefront at dollarshaveclub.com. Its e-commerce experience runs on Shopify; the storefront
  host exposes Shopify Customer Account OAuth2/OIDC discovery documents (including Shopify's
  customer-account-api and customer-account-mcp-api scopes) but Dollar Shave Club publishes no
  first-party public developer API, SDKs, or API documentation of its own. It was added to the
  API Evangelist network as a portfolio-lead stub of a16z, Cowboy Ventures, Dragoneer, and
  Forerunner Ventures.
